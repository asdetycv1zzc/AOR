        role: {type: string, maxLength: 512}
        sender: {enum: [USER, AGENT, SYSTEM]}
        state: {enum: [QUEUED, STREAMING, COMPLETED, FAILED]}
        content: {type: string, maxLength: 4194304}
        reasoningSummary: {type: string, maxLength: 4194304}
        errorCode: {type: string, maxLength: 512}
        provider: {type: string, maxLength: 512}
        model: {type: string, maxLength: 512}
        inputTokens: {type: integer, format: int64, minimum: 0}
        outputTokens: {type: integer, format: int64, minimum: 0}
        latencyMs: {type: integer, format: int64, minimum: 0}
        outputSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProjectActivitySnapshot:
      type: object
