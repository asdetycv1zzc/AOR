openapi: 3.2.0
info:
  title: Agent Organization Runtime API
  version: 1.0.0
  description: Deterministic, tenant-scoped control API for SPEC 2.0.0.
servers:
  - url: https://aor.example.invalid
security:
  - oidc: [aor]
  - mutualTLS: []
tags:
  - name: Projects
  - name: Goals
  - name: Plans
  - name: Tasks
  - name: Artifacts
  - name: Knowledge
  - name: Budgets
  - name: Administration
paths:
  /v1/projects:
    post:
      tags: [Projects]
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201': {$ref: '#/components/responses/ProjectCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200': {$ref: '#/components/responses/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/state:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProjectState
      responses:
        '200': {$ref: '#/components/responses/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}:pause:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: pauseProject
  /v1/projects/{projectId}:resume:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: resumeProject
  /v1/projects/{projectId}:abort:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: abortProject
  /v1/projects/{projectId}:archive:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: archiveProject
  /v1/projects/{projectId}:request-deletion:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: requestProjectDeletion
  /v1/projects/{projectId}:approve-release:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: approveProjectRelease
  /v1/projects/{projectId}/export:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: exportProject
      responses:
        '200':
          description: Content-addressed project export
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectExport'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/legal-holds:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectLegalHolds
      responses:
        '200':
          description: Immutable project legal-hold history
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectLegalHoldPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Projects]
      operationId: placeProjectLegalHold
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectLegalHoldCommand'}
      responses:
        '202': {$ref: '#/components/responses/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/legal-holds/{holdId}:release:
    post:
      tags: [Projects]
      operationId: releaseProjectLegalHold
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectLegalHoldCommand'}
      responses:
        '202': {$ref: '#/components/responses/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/messages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Goals]
      operationId: listGoalMessages
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Immutable user goal message artifacts
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalMessagePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Goals]
      operationId: sendGoalMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalMessageCommand'}
      responses:
        '202': {$ref: '#/components/responses/GoalCommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/specs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Goals]
      operationId: listGoalSpecs
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Version-ordered GoalSpec page
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalSpecPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/specs/{version}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [Goals]
      operationId: getGoalSpec
      responses:
        '200':
          description: Immutable GoalSpec
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '../json-schema/goal-spec.v1.schema.json'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/specs/{version}:approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [Goals]
      operationId: approveGoalSpec
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalDecisionCommand'}
      responses:
        '202': {$ref: '#/components/responses/GoalCommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/specs/{version}:reject:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [Goals]
      operationId: rejectGoalSpec
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalDecisionCommand'}
      responses:
        '202': {$ref: '#/components/responses/GoalCommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal:change:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Goals]
      operationId: changeGoal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalChangeCommand'}
      responses:
        '202': {$ref: '#/components/responses/GoalCommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/plans:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Plans]
      operationId: listPlans
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/plans/{version}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [Plans]
      operationId: getPlan
      responses:
        '200':
          description: Immutable PlanSpec
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '../json-schema/plan-spec.v1.schema.json'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      responses:
        '200': {$ref: '#/components/responses/Entity'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/submissions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskSubmissions
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Immutable submission manifests for the task
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmissionPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/audits:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskAudits
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit runs and immutable findings for the task
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskAuditPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/decisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: decideTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDecision'}
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/decision-report:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTaskDecisionReport
      responses:
        '200':
          description: Signed third-attempt report
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '../json-schema/user-decision-report.v1.schema.json'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Project-scoped immutable artifact metadata
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      parameters:
        - name: download
          in: query
          description: Stream the verified artifact body when true.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Artifact metadata or the verified artifact body
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-AOR-Artifact-URI:
              schema: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
            application/octet-stream:
              schema: {type: string, format: binary}
            '*/*':
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge:search:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Knowledge]
      operationId: searchKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeSearchRequest'}
      responses:
        '200':
          description: Revision-bound knowledge references without document bodies
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSearchResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge:read-range:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Knowledge]
      operationId: readKnowledgeRange
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeReadRangeRequest'}
      responses:
        '200':
          description: Hash-verified content from the exact referenced revision
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeReadRangeResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge/manifest:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Knowledge]
      operationId: getKnowledgeManifest
      parameters:
        - name: revision
          in: query
          schema: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      responses:
        '200':
          description: Immutable project knowledge manifest
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeManifest'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/budgets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Budgets]
      operationId: getBudgets
      responses:
        '200':
          description: Project budget accounts
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetCollection'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/usage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Budgets]
      operationId: getUsage
      responses:
        '200':
          description: Project budget usage
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetUsage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/budgets/usage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Budgets]
      operationId: getBudgetUsage
      responses:
        '200':
          description: Project budget usage compatibility route
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetUsage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/budgets:adjust:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Budgets]
      operationId: adjustBudget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BudgetAdjustment'}
      responses:
        '202':
          description: Budget adjustment committed and audited exactly once
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetAdjustmentResult'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: streamProjectEvents
      parameters:
        - name: after
          in: query
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: Resumable tenant-filtered CloudEvents stream
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /v1/admin/doctor:
    $ref: '#/components/pathItems/AdminCommand'
    x-operation-id: runDoctor
  /v1/admin/policies:test:
    $ref: '#/components/pathItems/AdminCommand'
    x-operation-id: testPolicies
  /v1/admin/sandboxes:probe:
    $ref: '#/components/pathItems/AdminCommand'
    x-operation-id: probeSandboxes
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
    mutualTLS:
      type: mutualTLS
  headers:
    ETag:
      description: Opaque aggregate version tag.
      schema: {type: string, pattern: '^"[A-Za-z0-9._:-]+"$'}
  parameters:
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}}
    TaskId: {name: taskId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,127}$'}}
    ArtifactId: {name: artifactId, in: path, required: true, schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}}
    HoldId: {name: holdId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,127}$'}}
    Version: {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, minLength: 3, maxLength: 256}}
  schemas:
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, goalAgentCount, dataClassification, deploymentTargets, budget]
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        goalAgentCount: {type: integer, minimum: 1, maximum: 2}
        dataClassification: {enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]}
        deploymentTargets:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        budget: {$ref: '#/components/schemas/ProjectBudgetSelection'}
    ProjectBudgetSelection:
      type: object
      additionalProperties: false
      required: [hardLimitMinor, softLimitMinor, currency]
      properties:
        hardLimitMinor: {type: integer, format: int64, minimum: 1}
        softLimitMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    Project:
      type: object
      additionalProperties: false
      required: [tenantId, id, name, createdBy, dataClassification, riskTolerance, state, version, goalAgentCount]
      properties:
        tenantId: {type: string, format: uuid}
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 256}
        createdBy: {type: string, minLength: 1, maxLength: 256}
        dataClassification: {enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]}
        deploymentTargets: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        budgetCurrency: {type: string, pattern: '^[A-Z]{3}$'}
        budgetHardLimitMinor: {type: integer, format: int64, minimum: 0}
        budgetSoftLimitMinor: {type: integer, format: int64, minimum: 0}
        promptBundleVersion: {type: string, minLength: 1, maxLength: 128}
        riskTolerance: {enum: [LOW, MEDIUM, HIGH]}
        state: {enum: [CREATED, GOAL_NEGOTIATING, GOAL_SUSPENDED, PLANNING, EXECUTING, INTEGRATING, GLOBAL_AUDIT, BLOCKED_USER_DECISION, PAUSED, COMPLETED, ABORTED, FAILED_SYSTEM, ARCHIVED]}
        version: {type: integer, format: int64, minimum: 1}
        goalAgentCount: {type: integer, minimum: 1, maximum: 2}
        goal: {type: object, additionalProperties: true}
        plan: {type: object, additionalProperties: true}
        releaseApprovalRecordId: {type: string, minLength: 1, maxLength: 128}
        pausedFromState: {type: string}
        deletion: {$ref: '#/components/schemas/ProjectDeletion'}
        legalHolds:
          type: array
          items: {$ref: '#/components/schemas/ProjectLegalHold'}
    ProjectDeletion:
      type: object
      additionalProperties: false
      required: [id, status, requestedBy, requestedAt, earliestExecutionAt]
      properties:
        id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,127}$'}
        status: {enum: [BLOCKED_LEGAL_HOLD, READY, ERASING, COMPLETED]}
        requestedBy: {type: string, minLength: 1, maxLength: 256}
        requestedAt: {type: string, format: date-time}
        earliestExecutionAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        proofSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        proofArtifactUri: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        backupExpiresAt: {type: string, format: date-time}
    ProjectLegalHold:
      type: object
      additionalProperties: false
      required: [id, reason, placedBy, placedAt]
      properties:
        id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,127}$'}
        reason: {type: string, minLength: 1, maxLength: 1024}
        placedBy: {type: string, minLength: 1, maxLength: 256}
        placedAt: {type: string, format: date-time}
        releasedBy: {type: string, minLength: 1, maxLength: 256}
        releasedAt: {type: string, format: date-time}
        releaseReason: {type: string, minLength: 1, maxLength: 1024}
    ProjectLegalHoldPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProjectLegalHold'}
    ProjectLegalHoldCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1024}
    ProjectExport:
      type: object
      additionalProperties: false
      required: [projectId, projectVersion, artifactId, uri, sha256, sizeBytes, createdAt]
      properties:
        projectId: {type: string, format: uuid}
        projectVersion: {type: integer, format: int64, minimum: 1}
        artifactId: {type: string, format: uuid}
        uri: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
    Command:
      type: object
      additionalProperties: true
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    GoalMessageCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, message]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        message: {type: string, minLength: 1, maxLength: 1048576}
    GoalMessage:
      type: object
      additionalProperties: false
      required: [id, tenantId, projectId, kind, message, contentSha256, artifactUri, createdAt, createdBy]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        kind: {enum: [USER, REJECTION, CHANGE_REQUEST]}
        message: {type: string, minLength: 1, maxLength: 1048576}
        contentSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        artifactUri: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string, minLength: 1, maxLength: 256}
    GoalMessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GoalMessage'}
        nextCursor: {type: string, maxLength: 512}
    GoalSpecPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '../json-schema/goal-spec.v1.schema.json'}
        nextCursor: {type: string, maxLength: 512}
    GoalDecisionCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, sha256]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        decision: {enum: [APPROVE, REJECT]}
        comment: {type: string, maxLength: 2048}
        idempotencyKey: {type: string, minLength: 1, maxLength: 256}
    GoalChangeCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, version, sha256, message, impactedTaskIds]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        version: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        message: {type: string, minLength: 1, maxLength: 1048576}
        impactedTaskIds:
          type: array
          uniqueItems: true
          maxItems: 10000
          items: {type: string, minLength: 3, maxLength: 128}
    TaskDecision:
      type: object
      additionalProperties: false
      required: [decision, expectedVersion]
      properties:
        decision: {enum: [ABORT_PROJECT, ABORT_MODULE, REVISE_GOAL, REVISE_MODULE_SPEC, HAND_OFF_TO_HUMAN, AUTHORIZE_NEW_ATTEMPT_SERIES]}
        expectedVersion: {type: integer, minimum: 0}
    TaskSubmissionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '../json-schema/submission-manifest.v1.schema.json'}
        nextCursor: {type: string, maxLength: 512}
    TaskAuditFinding:
      type: object
      additionalProperties: false
      required: [id, stableFingerprint, severity, category, ruleId, status, content, evidenceRefs, createdAt]
      properties:
        id: {type: string, format: uuid}
        stableFingerprint: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        severity: {enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]}
        category: {type: string, minLength: 1}
        ruleId: {type: string, minLength: 1}
        filePath: {type: string}
        lineStart: {type: integer, minimum: 1}
        lineEnd: {type: integer, minimum: 1}
        status: {enum: [OPEN, FIXED, ACCEPTED, FALSE_POSITIVE]}
        content: {type: object, additionalProperties: true}
        evidenceRefs:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
    TaskAuditRun:
      type: object
      additionalProperties: false
      required: [id, projectId, taskId, submissionId, phase, state, pipelineVersion, executionPlatform, isolationLevel, startedAt, findings]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        taskId: {type: string}
        submissionId: {type: string, format: uuid}
        phase: {enum: [DETERMINISTIC, LLM, INTEGRATION, GLOBAL]}
        state: {type: string, minLength: 1}
        pipelineVersion: {type: string, minLength: 1}
        executionPlatform: {enum: [LINUX, WINDOWS]}
        isolationLevel: {enum: [CONTAINER, NONE]}
        sandboxImageDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        auditorAgentId: {type: string}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        verdict: {enum: [PASS, FAIL, INCONCLUSIVE]}
        evidenceBundleRef: {type: string}
        findings:
          type: array
          items: {$ref: '#/components/schemas/TaskAuditFinding'}
    TaskAuditPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/TaskAuditRun'}
        nextCursor: {type: string, maxLength: 512}
    Artifact:
      type: object
      additionalProperties: false
      required: [id, projectId, uri, sha256, sizeBytes, contentType, classification, createdByPrincipal, metadata, createdAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        uri: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        contentType: {type: string, minLength: 1, maxLength: 256}
        classification: {enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]}
        createdByPrincipal: {type: string, minLength: 1, maxLength: 256}
        metadata: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
        retentionUntil: {type: string, format: date-time}
    ArtifactPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Artifact'}
        nextCursor: {type: string, maxLength: 512}
    KnowledgeReference:
      type: object
      additionalProperties: false
      required: [resourceUri, localPath, scopeRevision, sourceProjectId, path, revision, sha256, lineStart, lineEnd, encoding, lineEnding, contentType, title, tags, trustLevel, retrievalScore]
      properties:
        resourceUri: {type: string, format: uri, pattern: '^file:///'}
        localPath: {type: string, minLength: 1, maxLength: 4096}
        scopeRevision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sourceProjectId: {type: string, format: uuid}
        path: {type: string, minLength: 1, maxLength: 4096}
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        lineStart: {type: integer, minimum: 1}
        lineEnd: {type: integer, minimum: 1}
        encoding: {const: utf-8}
        lineEnding: {const: LF}
        contentType: {type: string, minLength: 1, maxLength: 256}
        title: {type: string, maxLength: 512}
        tags:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
        trustLevel: {enum: [SIGNED_POLICY, CURATED, PROJECT_APPROVED, GENERATED_UNREVIEWED, EXTERNAL_UNTRUSTED]}
        retrievalScore: {type: number, minimum: 0}
    KnowledgeSearchRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [path]
        - required: [title]
        - required: [tags]
        - required: [text]
      properties:
        path: {type: string, minLength: 1, maxLength: 4096}
        title: {type: string, minLength: 1, maxLength: 512}
        tags:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
        text: {type: string, minLength: 1, maxLength: 4096}
        limit: {type: integer, minimum: 1, maximum: 20, default: 8}
    KnowledgeSearchResponse:
      type: object
      additionalProperties: false
      required: [revision, references]
      properties:
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        references:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/KnowledgeReference'}
    KnowledgeReadRangeRequest:
      type: object
      additionalProperties: false
      required: [reference]
      properties:
        reference: {$ref: '#/components/schemas/KnowledgeReference'}
        lineStart: {type: integer, minimum: 1}
        lineEnd: {type: integer, minimum: 1}
    KnowledgeReadRangeResponse:
      type: object
      additionalProperties: false
      required: [reference, content]
      properties:
        reference: {$ref: '#/components/schemas/KnowledgeReference'}
        content: {type: string, maxLength: 32768}
        nextLine: {type: integer, minimum: 1}
    KnowledgeParentSnapshot:
      type: object
      additionalProperties: false
      required: [projectId, revision, order]
      properties:
        projectId: {type: string, format: uuid}
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        order: {type: integer, minimum: 0}
    KnowledgeDocumentMetadata:
      type: object
      additionalProperties: false
      required: [path, title, tags, trustLevel, contentType, sha256, lineCount]
      properties:
        path: {type: string, minLength: 1, maxLength: 4096}
        title: {type: string, maxLength: 512}
        tags:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
        trustLevel: {enum: [SIGNED_POLICY, CURATED, PROJECT_APPROVED, GENERATED_UNREVIEWED, EXTERNAL_UNTRUSTED]}
        contentType: {type: string, minLength: 1, maxLength: 256}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        lineCount: {type: integer, minimum: 1}
    KnowledgeManifest:
      type: object
      additionalProperties: false
      required: [version, tenantId, projectId, revision, createdAt, parentOrderExplicit, parents, overrides, documents]
      properties:
        version: {const: 1}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        parentOrderExplicit: {type: boolean}
        parents:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/KnowledgeParentSnapshot'}
        overrides:
          type: array
          items: {type: string, minLength: 1, maxLength: 4096}
        documents:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeDocumentMetadata'}
    BudgetAccount:
      type: object
      additionalProperties: false
      required: [id, scopeType, scopeId, currency, hardLimitMinor, softLimitMinor, spentMinor, reservedMinor, remainingMinor, periodStart, version]
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        scopeType: {enum: [PROJECT]}
        scopeId: {type: string, format: uuid}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        hardLimitMinor: {type: integer, format: int64, minimum: 0}
        softLimitMinor: {type: integer, format: int64, minimum: 0}
        spentMinor: {type: integer, format: int64, minimum: 0}
        reservedMinor: {type: integer, format: int64, minimum: 0}
        remainingMinor: {type: integer, format: int64, minimum: 0}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
    BudgetCollection:
      type: object
      additionalProperties: false
      required: [projectId, items, version]
      properties:
        projectId: {type: string, format: uuid}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BudgetAccount'}
        version: {type: integer, format: int64, minimum: 1}
    BudgetUsage:
      type: object
      additionalProperties: false
      required: [projectId, accountId, currency, hardLimitMinor, softLimitMinor, spentMinor, reservedMinor, remainingMinor, reservationCount, callCount, inputTokens, outputTokens, costMinor, version]
      properties:
        projectId: {type: string, format: uuid}
        accountId: {type: string, minLength: 1, maxLength: 256}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        hardLimitMinor: {type: integer, format: int64, minimum: 0}
        softLimitMinor: {type: integer, format: int64, minimum: 0}
        spentMinor: {type: integer, format: int64, minimum: 0}
        reservedMinor: {type: integer, format: int64, minimum: 0}
        remainingMinor: {type: integer, format: int64, minimum: 0}
        reservationCount: {type: integer, format: int64, minimum: 0}
        callCount: {type: integer, format: int64, minimum: 0}
        inputTokens: {type: integer, format: int64, minimum: 0}
        outputTokens: {type: integer, format: int64, minimum: 0}
        costMinor: {type: integer, format: int64, minimum: 0}
        version: {type: integer, format: int64, minimum: 1}
    BudgetAdjustment:
      type: object
      additionalProperties: false
      required: [expectedVersion, hardLimitMinor, softLimitMinor, currency, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        hardLimitMinor: {type: integer, format: int64, minimum: 0}
        softLimitMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        reason: {type: string, minLength: 1, maxLength: 2048}
    BudgetAdjustmentResult:
      type: object
      additionalProperties: false
      required: [projectId, account, usage]
      properties:
        projectId: {type: string, format: uuid}
        account: {$ref: '#/components/schemas/BudgetAccount'}
        usage: {$ref: '#/components/schemas/BudgetUsage'}
    Page:
      type: object
      required: [items]
      properties:
        items: {type: array}
        nextCursor: {type: string}
  responses:
    ProjectCreated:
      description: Project created
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Project'}
    Project:
      description: Project resource
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Project'}
    CommandAccepted:
      description: Command accepted exactly once
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {type: object, required: [commandId], properties: {commandId: {type: string}}}
    GoalCommandAccepted:
      description: Goal command committed, audited, and enqueued exactly once
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Project'}
    Page:
      description: Opaque-cursor page
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Page'}
    Entity:
      description: Tenant-scoped entity
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    Problem:
      description: Redacted AOR Problem Details
      content:
        application/problem+json:
          schema: {$ref: '../json-schema/aor-error.v1.schema.json'}
  pathItems:
    ProjectCommand:
      post:
        tags: [Projects]
        parameters:
          - $ref: '#/components/parameters/ProjectId'
          - $ref: '#/components/parameters/IdempotencyKey'
          - $ref: '#/components/parameters/IfMatch'
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Command'}
        responses:
          '202': {$ref: '#/components/responses/CommandAccepted'}
          default: {$ref: '#/components/responses/Problem'}
    VersionedProjectCommand:
      post:
        tags: [Goals]
        parameters:
          - $ref: '#/components/parameters/ProjectId'
          - $ref: '#/components/parameters/Version'
          - $ref: '#/components/parameters/IdempotencyKey'
          - $ref: '#/components/parameters/IfMatch'
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Command'}
        responses:
          '202': {$ref: '#/components/responses/CommandAccepted'}
          default: {$ref: '#/components/responses/Problem'}
    AdminCommand:
      post:
        tags: [Administration]
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        responses:
          '200': {$ref: '#/components/responses/Entity'}
          default: {$ref: '#/components/responses/Problem'}
