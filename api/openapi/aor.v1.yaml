openapi: 3.2.0
info:
  title: Agent Organization Runtime API
  version: 1.0.0
  description: Deterministic, tenant-scoped control API for SPEC 2.0.0.
servers:
  - url: https://aor.example.invalid
security:
  - oidc: [aor]
  - mutualTLS: []
tags:
  - name: Projects
  - name: Settings
  - name: Goals
  - name: Plans
  - name: Tasks
  - name: Leases
  - name: Artifacts
  - name: Knowledge
  - name: Budgets
  - name: Administration
paths:
  /v1/model-providers:
    get:
      tags: [Settings]
      operationId: listModelProviders
      responses:
        '200':
          description: Configured provider metadata without endpoints or credential references
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelProviderPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/toolchains:
    get:
      tags: [Settings]
      operationId: listToolchains
      responses:
        '200':
          description: Toolchains installed in the host-managed AOR inventory
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolchainInventory'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/settings/model-providers:
    get:
      tags: [Settings]
      operationId: getModelProviderSettings
      responses:
        '200':
          description: Provider endpoints and write-only credential status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelProviderSettingsPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/settings/model-providers/{providerId}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    put:
      tags: [Settings]
      operationId: putModelProviderSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelProviderSettingsInput'}
      responses:
        '200':
          description: Saved provider settings without the API key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelProviderSettings'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/settings/model-providers/{providerId}:test:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    post:
      tags: [Settings]
      operationId: testModelProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelProviderTestInput'}
      responses:
        '200':
          description: Sanitized connectivity result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelProviderTestResult'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/settings/model-routes:
    get:
      tags: [Settings]
      operationId: getModelRouteSettings
      responses:
        '200': {$ref: '#/components/responses/ModelRouteSettings'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Settings]
      operationId: putModelRouteSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [modelRoutes]
              properties:
                modelRoutes: {$ref: '#/components/schemas/ModelRoutes'}
      responses:
        '200': {$ref: '#/components/responses/ModelRouteSettings'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/settings/model-sampling:
    get:
      tags: [Settings]
      operationId: getModelSamplingSettings
      responses:
        '200':
          description: Tenant-global generation parameters used for subsequent model calls
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelSamplingSettings'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Settings]
      operationId: putModelSamplingSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelSamplingSettingsInput'}
      responses:
        '200':
          description: Saved tenant-global generation parameters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelSamplingSettings'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects visible to the current tenant principal
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Projects]
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201': {$ref: '#/components/responses/ProjectCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200': {$ref: '#/components/responses/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/state:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProjectState
      responses:
        '200': {$ref: '#/components/responses/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}:pause:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: pauseProject
  /v1/projects/{projectId}:resume:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: resumeProject
  /v1/projects/{projectId}:abort:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: abortProject
  /v1/projects/{projectId}:archive:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: archiveProject
  /v1/projects/{projectId}:request-deletion:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: requestProjectDeletion
  /v1/projects/{projectId}:execute-deletion:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: executeProjectDeletion
  /v1/projects/{projectId}:approve-release:
    $ref: '#/components/pathItems/ProjectCommand'
    x-operation-id: approveProjectRelease
  /v1/projects/{projectId}/export:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: exportProject
      responses:
        '200':
          description: Content-addressed project export
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectExport'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/legal-holds:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectLegalHolds
      responses:
        '200':
          description: Immutable project legal-hold history
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectLegalHoldPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Projects]
      operationId: placeProjectLegalHold
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectLegalHoldCommand'}
      responses:
        '202': {$ref: '#/components/responses/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/legal-holds/{holdId}:release:
    post:
      tags: [Projects]
      operationId: releaseProjectLegalHold
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/HoldId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectLegalHoldCommand'}
      responses:
        '202': {$ref: '#/components/responses/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/messages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Goals]
      operationId: listGoalMessages
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Immutable user goal message artifacts
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalMessagePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Goals]
      operationId: sendGoalMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalMessageCommand'}
      responses:
        '202': {$ref: '#/components/responses/GoalCommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/specs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Goals]
      operationId: listGoalSpecs
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Version-ordered GoalSpec page
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalSpecPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/specs/{version}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [Goals]
      operationId: getGoalSpec
      responses:
        '200':
          description: Immutable GoalSpec
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '../json-schema/goal-spec.v1.schema.json'}
                  - {$ref: '../json-schema/goal-spec.v2.schema.json'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/specs/{version}:approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [Goals]
      operationId: approveGoalSpec
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalDecisionCommand'}
      responses:
        '202': {$ref: '#/components/responses/GoalCommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal/specs/{version}:reject:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Version'
    post:
      tags: [Goals]
      operationId: rejectGoalSpec
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalDecisionCommand'}
      responses:
        '202': {$ref: '#/components/responses/GoalCommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/goal:change:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Goals]
      operationId: changeGoal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalChangeCommand'}
      responses:
        '202': {$ref: '#/components/responses/GoalCommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/plans:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Plans]
      operationId: listPlans
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/plans/{version}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [Plans]
      operationId: getPlan
      responses:
        '200':
          description: Immutable PlanSpec
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '../json-schema/plan-spec.v1.schema.json'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      responses:
        '200': {$ref: '#/components/responses/Entity'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/leases:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Leases]
      operationId: issueTaskLease
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaseGrantCommand'}
      responses:
        '201': {$ref: '#/components/responses/CapabilityLeaseCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/leases:renew:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Leases]
      operationId: renewTaskLease
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaseRenewCommand'}
      responses:
        '200': {$ref: '#/components/responses/CapabilityLease'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/leases:heartbeat:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Leases]
      operationId: heartbeatTaskLease
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaseHeartbeatCommand'}
      responses:
        '200': {$ref: '#/components/responses/CapabilityLease'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/leases:revoke:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Leases]
      operationId: revokeTaskLease
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaseRevokeCommand'}
      responses:
        '204': {description: Capability lease revoked}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/submissions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskSubmissions
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Immutable submission manifests for the task
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSubmissionPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/audits:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskAudits
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit runs and immutable findings for the task
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskAuditPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/decisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: decideTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDecision'}
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/tasks/{taskId}/decision-report:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTaskDecisionReport
      responses:
        '200':
          description: Signed third-attempt report
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '../json-schema/user-decision-report.v1.schema.json'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Project-scoped immutable artifact metadata
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      parameters:
        - name: download
          in: query
          description: Stream the verified artifact body when true.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Artifact metadata or the verified artifact body
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-AOR-Artifact-URI:
              schema: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
            application/octet-stream:
              schema: {type: string, format: binary}
            '*/*':
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/toolchain-archives:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Artifacts]
      operationId: uploadToolchainArchive
      summary: Upload a prebuilt crosstool-ng GCC or G++ tar.gz artifact
      description: The immutable upload is not scheduled until a subsequent Goal message authorizes and references it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            x-aor-part-order: [toolName, toolVersion, architecture, file]
            schema:
              type: object
              additionalProperties: false
              required: [file, toolName, toolVersion, architecture]
              properties:
                file:
                  type: string
                  format: binary
                  description: Prebuilt crosstool-ng tar.gz archive, at most 4 GiB.
                toolName:
                  type: string
                  enum: [GCC, G++, GNU GCC, GNU G++, GNU C++]
                toolVersion:
                  type: string
                  minLength: 1
                  maxLength: 256
                architecture:
                  type: string
                  minLength: 1
                  maxLength: 128
            encoding:
              file:
                contentType: application/gzip, application/x-gzip
      responses:
        '201':
          description: Project-scoped immutable archive; linked remains false until Goal negotiation references it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolchainArchiveUpload'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge:search:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Knowledge]
      operationId: searchKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeSearchRequest'}
      responses:
        '200':
          description: Revision-bound knowledge references without document bodies
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSearchResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge:read-range:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Knowledge]
      operationId: readKnowledgeRange
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeReadRangeRequest'}
      responses:
        '200':
          description: Hash-verified content from the exact referenced revision
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeReadRangeResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge/manifest:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Knowledge]
      operationId: getKnowledgeManifest
      parameters:
        - name: revision
          in: query
          schema: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      responses:
        '200':
          description: Immutable project knowledge manifest
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeManifest'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge:propose-update:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Knowledge]
      operationId: proposeKnowledgeUpdate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeUpdateDraftRequest'}
      responses:
        '201':
          description: Immutable Curator draft awaiting exact human approval
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeUpdate'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge/updates/{updateId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: updateId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Knowledge]
      operationId: getKnowledgeUpdate
      responses:
        '200':
          description: Exact Curator proposal and its durable status
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeUpdate'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/knowledge/updates/{updateId}:approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: updateId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Knowledge]
      operationId: approveKnowledgeUpdate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeUpdateApprovalRequest'}
      responses:
        '200':
          description: Approved proposal atomically committed and indexed
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeUpdate'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/budgets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Budgets]
      operationId: getBudgets
      responses:
        '200':
          description: Project budget accounts
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetCollection'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/usage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Budgets]
      operationId: getUsage
      responses:
        '200':
          description: Project budget usage
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetUsage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/budgets/usage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Budgets]
      operationId: getBudgetUsage
      responses:
        '200':
          description: Project budget usage compatibility route
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetUsage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/budgets:adjust:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Budgets]
      operationId: adjustBudget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BudgetAdjustment'}
      responses:
        '202':
          description: Budget adjustment committed and audited exactly once
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetAdjustmentResult'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: streamProjectEvents
      parameters:
        - name: after
          in: query
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: Resumable tenant-filtered CloudEvents stream
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/toolchain-installations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectToolchainInstallations
      responses:
        '200':
          description: Durable installation and Goal recovery status for project toolchains
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolchainInstallationPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProjectActivity
      responses:
        '200':
          description: Current project workflow, agent, and conversation activity
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectActivitySnapshot'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/activity/events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: streamProjectActivity
      parameters:
        - name: after
          in: query
          schema: {type: string, maxLength: 512}
        - name: follow
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Live activity message updates; reconnects replay the mutable snapshot
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /v1/projects/{projectId}/activity/messages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: queueProjectActivityMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectActivityIntervention'}
      responses:
        '202':
          description: User message queued for the selected workflow or agent
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectActivityMessage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/admin/doctor:
    $ref: '#/components/pathItems/AdminCommand'
    x-operation-id: runDoctor
  /v1/admin/policies:test:
    $ref: '#/components/pathItems/AdminCommand'
    x-operation-id: testPolicies
  /v1/admin/sandboxes:probe:
    $ref: '#/components/pathItems/AdminCommand'
    x-operation-id: probeSandboxes
  /v1/admin/backup:verify:
    $ref: '#/components/pathItems/AdminCommand'
    x-operation-id: verifyBackup
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
    mutualTLS:
      type: mutualTLS
  headers:
    ETag:
      description: Opaque aggregate version tag.
      schema: {type: string, pattern: '^"[A-Za-z0-9._:-]+"$'}
  parameters:
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}}
    TaskId: {name: taskId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,127}$'}}
    ArtifactId: {name: artifactId, in: path, required: true, schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}}
    HoldId: {name: holdId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,127}$'}}
    ProviderId: {name: providerId, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'}}
    Version: {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, minLength: 3, maxLength: 256}}
  schemas:
    ProjectModelRoute:
      type: object
      additionalProperties: false
      required: [provider, model, reasoningEffort, maxOutputTokens, temperature, providerPolicy, cachePolicy, worstCaseCostMicros, maxAttempts]
      properties:
        provider: {type: string, minLength: 1, maxLength: 128}
        model: {type: string, minLength: 1, maxLength: 256}
        reasoningEffort: {enum: ['', none, low, medium, high, xhigh, max]}
        maxOutputTokens: {type: integer, minimum: 1, maximum: 1000000}
        thinkingBudget: {type: integer, minimum: 0, default: 0, description: "Provider-specific thinking token budget; 0 leaves the provider default in effect and non-zero values must be lower than maxOutputTokens."}
        temperature: {type: number, minimum: 0, maximum: 2}
        seed: {type: integer, format: int64}
        providerPolicy: {type: string, minLength: 1, maxLength: 256}
        cachePolicy: {type: string, minLength: 1, maxLength: 128}
        worstCaseCostMicros: {type: integer, format: int64, minimum: 0}
        maxAttempts: {type: integer, minimum: 1, maximum: 5}
    ModelRoutes:
      type: object
      additionalProperties: false
      required: [GOAL_PROPOSER, GOAL_CHALLENGER, PLAN_SUPERVISOR, MODULE_PLANNER, EXECUTOR, MODULE_AUDITOR, GLOBAL_AUDITOR, KNOWLEDGE_CURATOR]
      properties:
        GOAL_PROPOSER: {$ref: '#/components/schemas/ProjectModelRoute'}
        GOAL_CHALLENGER: {$ref: '#/components/schemas/ProjectModelRoute'}
        PLAN_SUPERVISOR: {$ref: '#/components/schemas/ProjectModelRoute'}
        MODULE_PLANNER: {$ref: '#/components/schemas/ProjectModelRoute'}
        EXECUTOR: {$ref: '#/components/schemas/ProjectModelRoute'}
        MODULE_AUDITOR: {$ref: '#/components/schemas/ProjectModelRoute'}
        GLOBAL_AUDITOR: {$ref: '#/components/schemas/ProjectModelRoute'}
        KNOWLEDGE_CURATOR: {$ref: '#/components/schemas/ProjectModelRoute'}
    ModelRouteSettings:
      type: object
      additionalProperties: false
      required: [modelRoutes, version]
      properties:
        modelRoutes: {$ref: '#/components/schemas/ModelRoutes'}
        version: {type: integer, format: int64, minimum: 0}
    ModelSamplingSettingsInput:
      type: object
      additionalProperties: false
      required: [temperature, topP, topK]
      properties:
        temperature: {type: number, minimum: 0, maximum: 2}
        topP: {type: number, minimum: 0, maximum: 1}
        topK: {type: integer, minimum: 0, maximum: 500}
    ModelSamplingSettings:
      type: object
      additionalProperties: false
      required: [temperature, topP, topK, version]
      properties:
        temperature: {type: number, minimum: 0, maximum: 2}
        topP: {type: number, minimum: 0, maximum: 1}
        topK: {type: integer, minimum: 0, maximum: 500}
        version: {type: integer, format: int64, minimum: 0}
    ModelProvider:
      type: object
      additionalProperties: false
      required: [id, provider, models, inputMicrosPerToken, outputMicrosPerToken, supportsStreaming, supportsToolCalls, supportsJsonSchema, supportsSeed, supportsPromptCaching, maxInputTokens, maxOutputTokens, allowedDataClassifications, dataResidency, retentionPolicy, modalities]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        provider: {type: string, minLength: 1, maxLength: 128}
        models:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
        inputMicrosPerToken: {type: integer, format: int64, minimum: 0}
        outputMicrosPerToken: {type: integer, format: int64, minimum: 0}
        supportsStreaming: {type: boolean}
        supportsToolCalls: {type: boolean}
        supportsJsonSchema: {type: boolean}
        supportsSeed: {type: boolean}
        supportsPromptCaching: {type: boolean}
        maxInputTokens: {type: integer, minimum: 1}
        maxOutputTokens: {type: integer, minimum: 1}
        modelMaxOutputTokens:
          type: object
          additionalProperties: {type: integer, minimum: 1, maximum: 1000000}
        allowedDataClassifications:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
        dataResidency:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        retentionPolicy: {type: string, minLength: 1, maxLength: 256}
        modalities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
    ModelProviderPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModelProvider'}
    ToolchainExecutable:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        path: {type: string, minLength: 1, maxLength: 4096}
    InstalledToolchain:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, kind, name, version, platform, architecture, languages, binDirs, executables]
      properties:
        schemaVersion: {const: 1}
        id: {type: string, pattern: '^[A-Za-z0-9._-]+$', maxLength: 128}
        kind: {enum: [COMPILER, RUNTIME, SDK, BUILD, INTEROP, TEST]}
        name: {type: string, minLength: 1, maxLength: 128}
        version: {type: string, minLength: 1, maxLength: 256, pattern: '^[^*?<>^~|,]+$', description: Exact installed version; ranges and wildcard versions are forbidden.}
        platform: {enum: [LINUX, WINDOWS]}
        architecture: {type: string, minLength: 1, maxLength: 128}
        languages:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        binDirs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 4096}
        executables:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ToolchainExecutable'}
    ToolchainInventory:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          items: {$ref: '#/components/schemas/InstalledToolchain'}
    ToolchainInstallation:
      type: object
      additionalProperties: false
      required: [id, name, version, kind, platform, architecture, state, attempt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        version: {type: string, minLength: 1, maxLength: 256}
        kind: {enum: [COMPILER, RUNTIME, SDK, BUILD, INTEROP, TEST]}
        platform: {enum: [LINUX, WINDOWS]}
        architecture: {type: string, minLength: 1, maxLength: 128}
        state: {enum: [QUEUED, INSTALLING, INSTALLED, FAILED]}
        attempt: {type: integer, minimum: 0, maximum: 5}
        inventoryId: {type: string, minLength: 1, maxLength: 128}
        lastErrorCode: {type: string, minLength: 1, maxLength: 128}
        lastErrorMessage: {type: string, minLength: 1, maxLength: 4096}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ToolchainInstallationBatch:
      type: object
      additionalProperties: false
      required: [id, goalSpecId, goalVersion, state, recoveryAttempt, installations]
      properties:
        id: {type: string, format: uuid}
        goalSpecId: {type: string, format: uuid}
        goalVersion: {type: integer, minimum: 1}
        state: {enum: [WAITING, READY, RECOVERING, COMPLETED, FAILED]}
        recoveryAttempt: {type: integer, minimum: 0, maximum: 5}
        installations:
          type: array
          items: {$ref: '#/components/schemas/ToolchainInstallation'}
    ToolchainInstallationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ToolchainInstallationBatch'}
    ModelProviderSettings:
      type: object
      additionalProperties: false
      required: [id, provider, displayName, custom, baseUrl, protocol, protocols, models, apiKeyConfigured, enabled, version]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'}
        provider: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'}
        displayName: {type: string, minLength: 1, maxLength: 128}
        custom: {type: boolean}
        baseUrl: {type: string, maxLength: 2048}
        protocol: {enum: [openai-compatible, openai-responses, anthropic-messages]}
        protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [openai-compatible, openai-responses, anthropic-messages]}
        models:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
        apiKeyConfigured: {type: boolean}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
    ModelProviderSettingsPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModelProviderSettings'}
    ModelProviderSettingsInput:
      type: object
      additionalProperties: false
      required: [baseUrl, protocol, enabled]
      properties:
        baseUrl: {type: string, maxLength: 2048}
        displayName: {type: string, minLength: 1, maxLength: 128}
        protocol: {enum: [openai-compatible, openai-responses, anthropic-messages]}
        apiKey: {type: string, minLength: 1, maxLength: 65536, writeOnly: true}
        models:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
        enabled: {type: boolean}
    ModelProviderTestInput:
      type: object
      additionalProperties: false
      required: [baseUrl, protocol, model, reasoningEffort]
      properties:
        baseUrl: {type: string, minLength: 1, maxLength: 2048}
        protocol: {enum: [openai-compatible, openai-responses, anthropic-messages]}
        apiKey: {type: string, minLength: 1, maxLength: 65536, writeOnly: true}
        model: {type: string, minLength: 1, maxLength: 256}
        reasoningEffort: {enum: ['', none, low, medium, high, xhigh, max]}
    ModelProviderTestResult:
      type: object
      additionalProperties: false
      required: [ok, model]
      properties:
        ok: {type: boolean}
        model: {type: string, minLength: 1, maxLength: 256}
        latencyMs: {type: integer, format: int64, minimum: 0}
        detail: {type: string, maxLength: 256}
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, goalAgentCount, dataClassification, budget]
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        goalAgentCount: {type: integer, minimum: 1, maximum: 2}
        dataClassification: {enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]}
        deploymentTargets:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        budget: {$ref: '#/components/schemas/ProjectBudgetSelection'}
        modelRoutes: {$ref: '#/components/schemas/ModelRoutes'}
    ProjectBudgetSelection:
      type: object
      additionalProperties: false
      required: [hardLimitMinor, softLimitMinor, currency]
      properties:
        hardLimitMinor: {type: integer, format: int64, minimum: 1}
        softLimitMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    Project:
      type: object
      additionalProperties: false
      required: [tenantId, id, name, createdBy, dataClassification, riskTolerance, state, version, goalAgentCount, goalProcessing]
      properties:
        tenantId: {type: string, format: uuid}
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 256}
        createdBy: {type: string, minLength: 1, maxLength: 256}
        dataClassification: {enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]}
        deploymentTargets: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        budgetCurrency: {type: string, pattern: '^[A-Z]{3}$'}
        budgetHardLimitMinor: {type: integer, format: int64, minimum: 0}
        budgetSoftLimitMinor: {type: integer, format: int64, minimum: 0}
        promptBundleVersion: {type: string, minLength: 1, maxLength: 128}
        riskTolerance: {enum: [LOW, MEDIUM, HIGH]}
        state: {enum: [CREATED, GOAL_NEGOTIATING, GOAL_SUSPENDED, PLANNING, EXECUTING, INTEGRATING, GLOBAL_AUDIT, BLOCKED_USER_DECISION, PAUSED, COMPLETED, ABORTED, FAILED_SYSTEM, ARCHIVED]}
        version: {type: integer, format: int64, minimum: 1}
        goalAgentCount: {type: integer, minimum: 1, maximum: 2}
        goalProcessing: {type: boolean}
        modelRoutes: {$ref: '#/components/schemas/ModelRoutes'}
        goal: {type: object, additionalProperties: true}
        plan: {type: object, additionalProperties: true}
        coreSummary: {$ref: '#/components/schemas/CoreSummary'}
        releaseApprovalRecordId: {type: string, minLength: 1, maxLength: 128}
        pausedFromState: {type: string}
        deletion: {$ref: '#/components/schemas/ProjectDeletion'}
        legalHolds:
          type: array
          items: {$ref: '#/components/schemas/ProjectLegalHold'}
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Project'}
        nextCursor: {type: string, maxLength: 512}
    CoreSummary:
      type: object
      additionalProperties: false
      required: [summaryVersion, tenantId, projectId, status, goalSpecRef, planSpecRef, modules, summarySha256, createdAt]
      properties:
        summaryVersion: {type: integer, minimum: 1, maximum: 1}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        status: {enum: [COMPLETED]}
        goalSpecRef: {$ref: '#/components/schemas/SpecReference'}
        planSpecRef: {$ref: '#/components/schemas/SpecReference'}
        modules:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CoreModuleOutcome'}
        summarySha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
    CoreModuleOutcome:
      type: object
      additionalProperties: false
      required: [taskId, moduleId, state, version, moduleSpecRef, attempt, attemptSeriesId]
      properties:
        taskId: {type: string, format: uuid}
        moduleId: {type: string, minLength: 1, maxLength: 128}
        state: {enum: [PASSED]}
        version: {type: integer, format: int64, minimum: 1}
        moduleSpecRef: {$ref: '#/components/schemas/SpecReference'}
        attempt: {type: integer, minimum: 1, maximum: 3}
        attemptSeriesId: {type: string, format: uuid}
    SpecReference:
      type: object
      additionalProperties: false
      required: [version, sha256]
      properties:
        version: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    ProjectDeletion:
      type: object
      additionalProperties: false
      required: [id, status, requestedBy, requestedAt, earliestExecutionAt]
      properties:
        id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,127}$'}
        status: {enum: [BLOCKED_LEGAL_HOLD, READY, ERASING, COMPLETED]}
        requestedBy: {type: string, minLength: 1, maxLength: 256}
        requestedAt: {type: string, format: date-time}
        earliestExecutionAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        proofSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        proofArtifactUri: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        backupExpiresAt: {type: string, format: date-time}
    ProjectLegalHold:
      type: object
      additionalProperties: false
      required: [id, reason, placedBy, placedAt]
      properties:
        id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{2,127}$'}
        reason: {type: string, minLength: 1, maxLength: 1024}
        placedBy: {type: string, minLength: 1, maxLength: 256}
        placedAt: {type: string, format: date-time}
        releasedBy: {type: string, minLength: 1, maxLength: 256}
        releasedAt: {type: string, format: date-time}
        releaseReason: {type: string, minLength: 1, maxLength: 1024}
    ProjectLegalHoldPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProjectLegalHold'}
    ProjectLegalHoldCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1024}
    ProjectExport:
      type: object
      additionalProperties: false
      required: [projectId, projectVersion, artifactId, uri, sha256, sizeBytes, createdAt]
      properties:
        projectId: {type: string, format: uuid}
        projectVersion: {type: integer, format: int64, minimum: 1}
        artifactId: {type: string, format: uuid}
