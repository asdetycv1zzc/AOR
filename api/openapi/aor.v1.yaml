    TaskDecision:
      type: object
      additionalProperties: false
      required: [decision, expectedVersion]
      properties:
        decision: {enum: [ABORT_PROJECT, ABORT_MODULE, REVISE_GOAL, REVISE_MODULE_SPEC, HAND_OFF_TO_HUMAN, AUTHORIZE_NEW_ATTEMPT_SERIES]}
        expectedVersion: {type: integer, minimum: 0}
    LeaseResource:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type: {type: string, minLength: 1, maxLength: 128, pattern: '^[^\r\n\x00]+$'}
        id: {type: string, minLength: 1, maxLength: 512, pattern: '^[^\r\n\x00]+$'}
        path: {type: string, minLength: 1, maxLength: 4096, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$))[^\r\n\x00]+$'}
        attributes:
          type: object
          maxProperties: 32
          additionalProperties: {type: string, minLength: 1, maxLength: 1024, pattern: '^[^\r\n\x00]+$'}
    LeaseGrantCommand:
      type: object
      additionalProperties: false
      required: [action, resource, parameterDigest, budgetAccountId]
      properties:
        action: {type: string, pattern: '^[a-z][a-z0-9_.:-]{0,127}$'}
        resource: {$ref: '#/components/schemas/LeaseResource'}
        parameterDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        budgetAccountId: {type: string, minLength: 1, maxLength: 128}
        approvalId: {type: string, minLength: 1, maxLength: 128}
        ttlSeconds: {type: integer, format: int64, minimum: 0, maximum: 900}
    LeaseRenewCommand:
      type: object
      additionalProperties: false
      required: [action, resource, parameterDigest, budgetAccountId, leaseId, fencingToken, policyVersion]
      properties:
        action: {type: string, pattern: '^[a-z][a-z0-9_.:-]{0,127}$'}
        resource: {$ref: '#/components/schemas/LeaseResource'}
        parameterDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        budgetAccountId: {type: string, minLength: 1, maxLength: 128}
        approvalId: {type: string, minLength: 1, maxLength: 128}
        ttlSeconds: {type: integer, format: int64, minimum: 0, maximum: 900}
        leaseId: {type: string, minLength: 1, maxLength: 128}
        fencingToken: {type: integer, format: int64, minimum: 1}
        policyVersion: {type: string, minLength: 1, maxLength: 128}
    LeaseHeartbeatCommand:
      type: object
      additionalProperties: false
      required: [leaseId, fencingToken]
      properties:
        leaseId: {type: string, minLength: 1, maxLength: 128}
        fencingToken: {type: integer, format: int64, minimum: 1}
    LeaseRevokeCommand:
      type: object
      additionalProperties: false
      required: [leaseId, reason]
      properties:
        leaseId: {type: string, minLength: 1, maxLength: 128}
        reason: {type: string, minLength: 1, maxLength: 256}
    CapabilityLease:
      type: object
      additionalProperties: false
      required: [id, agentInstanceId, principalId, principalType, tenantId, projectId, projectVersion, taskId, taskVersion, specDigest, role, action, resource, parameterDigest, capabilities, issuedAt, expiresAt, lastHeartbeatAt, heartbeatIntervalSeconds, policyVersion, budgetAccountId, nonce, fencingToken, state, signature]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        agentInstanceId: {type: string, minLength: 1, maxLength: 256}
        principalId: {type: string, minLength: 1, maxLength: 256}
        principalType: {enum: [USER, SERVICE, AGENT_RUNTIME, AGENT_INSTANCE, SANDBOX, MCP_SERVER, CI_RUNNER, KNOWLEDGE_CURATOR, BREAK_GLASS_ADMIN]}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        projectVersion: {type: integer, format: int64, minimum: 0}
        taskId: {type: string, minLength: 1, maxLength: 128}
        taskVersion: {type: integer, format: int64, minimum: 0}
        specDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        role: {type: string, minLength: 1, maxLength: 128}
        action: {type: string, pattern: '^[a-z][a-z0-9_.:-]{0,127}$'}
        resource: {$ref: '#/components/schemas/LeaseResource'}
        parameterDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        capabilities:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        lastHeartbeatAt: {type: string, format: date-time}
        heartbeatIntervalSeconds: {type: integer, format: int64, minimum: 1, maximum: 300}
        policyVersion: {type: string, minLength: 1, maxLength: 128}
        budgetAccountId: {type: string, minLength: 1, maxLength: 128}
        nonce: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        fencingToken: {type: integer, format: int64, minimum: 1}
        state: {enum: [ACTIVE, REVOKED, EXPIRED]}
        revokedAt: {type: string, format: date-time}
        signature: {type: string, pattern: '^hmac-sha256:[0-9a-f]{64}$'}
    TaskSubmissionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '../json-schema/submission-manifest.v1.schema.json'}
        nextCursor: {type: string, maxLength: 512}
    TaskAuditFinding:
      type: object
      additionalProperties: false
      required: [id, stableFingerprint, severity, category, ruleId, status, content, evidenceRefs, createdAt]
      properties:
        id: {type: string, format: uuid}
        stableFingerprint: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        severity: {enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]}
        category: {type: string, minLength: 1}
        ruleId: {type: string, minLength: 1}
        filePath: {type: string}
        lineStart: {type: integer, minimum: 1}
        lineEnd: {type: integer, minimum: 1}
        status: {enum: [OPEN, FIXED, ACCEPTED, FALSE_POSITIVE]}
        content: {type: object, additionalProperties: true}
        evidenceRefs:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
    TaskAuditRun:
      type: object
      additionalProperties: false
      required: [id, projectId, taskId, submissionId, phase, state, pipelineVersion, executionPlatform, isolationLevel, startedAt, findings]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        taskId: {type: string}
        submissionId: {type: string, format: uuid}
        phase: {enum: [DETERMINISTIC, LLM, INTEGRATION, GLOBAL]}
        state: {type: string, minLength: 1}
        pipelineVersion: {type: string, minLength: 1}
        executionPlatform: {enum: [LINUX, WINDOWS]}
        isolationLevel: {enum: [CONTAINER, NONE]}
        sandboxImageDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        auditorAgentId: {type: string}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        verdict: {enum: [PASS, FAIL, INCONCLUSIVE]}
        evidenceBundleRef: {type: string}
        findings:
          type: array
          items: {$ref: '#/components/schemas/TaskAuditFinding'}
    TaskAuditPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/TaskAuditRun'}
        nextCursor: {type: string, maxLength: 512}
    Artifact:
      type: object
      additionalProperties: false
      required: [id, projectId, uri, sha256, sizeBytes, contentType, classification, createdByPrincipal, metadata, createdAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        uri: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        contentType: {type: string, minLength: 1, maxLength: 256}
        classification: {enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]}
        createdByPrincipal: {type: string, minLength: 1, maxLength: 256}
        metadata: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
        retentionUntil: {type: string, format: date-time}
    ArtifactPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Artifact'}
        nextCursor: {type: string, maxLength: 512}
    ToolchainArchiveUpload:
      type: object
      additionalProperties: false
      required: [id, artifactRef, sourceSha256, sizeBytes, toolName, toolVersion, architecture, linked]
      properties:
        id: {type: string, format: uuid}
        artifactRef: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        sourceSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sizeBytes: {type: integer, format: int64, minimum: 1, maximum: 4294967296}
        toolName: {type: string, enum: [GCC, G++, GNU GCC, GNU G++, GNU C++]}
        toolVersion: {type: string, minLength: 1, maxLength: 256}
        architecture: {type: string, minLength: 1, maxLength: 128}
        linked: {type: boolean, const: false}
    KnowledgeSourceReference:
      type: object
      additionalProperties: false
      required: [uri, revision, sha256, trustLevel]
      properties:
        uri: {type: string, format: uri, minLength: 1, maxLength: 2048}
        revision: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/+@=-]{0,255}$'}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        trustLevel: {enum: [SIGNED_POLICY, CURATED, PROJECT_APPROVED, GENERATED_UNREVIEWED, EXTERNAL_UNTRUSTED]}
    KnowledgeReference:
      type: object
      additionalProperties: false
      required: [resourceUri, localPath, scopeRevision, sourceProjectId, path, revision, sha256, lineStart, lineEnd, encoding, lineEnding, contentType, title, tags, trustLevel, retrievalScore]
      properties:
        resourceUri: {type: string, format: uri, pattern: '^file:///'}
        localPath: {type: string, minLength: 1, maxLength: 4096}
        scopeRevision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sourceProjectId: {type: string, format: uuid}
        path: {type: string, minLength: 1, maxLength: 4096}
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        lineStart: {type: integer, minimum: 1}
        lineEnd: {type: integer, minimum: 1}
        encoding: {const: utf-8}
        lineEnding: {const: LF}
        contentType: {type: string, minLength: 1, maxLength: 256}
        title: {type: string, maxLength: 512}
        tags:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
        trustLevel: {enum: [SIGNED_POLICY, CURATED, PROJECT_APPROVED, GENERATED_UNREVIEWED, EXTERNAL_UNTRUSTED]}
        source: {$ref: '#/components/schemas/KnowledgeSourceReference'}
        retrievalScore: {type: number, minimum: 0}
    KnowledgeSearchRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [path]
        - required: [title]
        - required: [tags]
        - required: [text]
      properties:
        path: {type: string, minLength: 1, maxLength: 4096}
        title: {type: string, minLength: 1, maxLength: 512}
        tags:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
        text: {type: string, minLength: 1, maxLength: 4096}
        limit: {type: integer, minimum: 1, maximum: 20, default: 8}
    KnowledgeSearchResponse:
      type: object
      additionalProperties: false
      required: [revision, references]
      properties:
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        references:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/KnowledgeReference'}
    KnowledgeReadRangeRequest:
      type: object
      additionalProperties: false
      required: [reference]
      properties:
        reference: {$ref: '#/components/schemas/KnowledgeReference'}
        lineStart: {type: integer, minimum: 1}
        lineEnd: {type: integer, minimum: 1}
    KnowledgeReadRangeResponse:
      type: object
      additionalProperties: false
      required: [reference, content]
      properties:
        reference: {$ref: '#/components/schemas/KnowledgeReference'}
        content: {type: string, maxLength: 32768}
        nextLine: {type: integer, minimum: 1}
    KnowledgeParentSnapshot:
      type: object
      additionalProperties: false
      required: [projectId, revision, order]
      properties:
        projectId: {type: string, format: uuid}
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        order: {type: integer, minimum: 0}
    KnowledgeDocumentMetadata:
      type: object
      additionalProperties: false
      required: [path, title, tags, trustLevel, contentType, sha256, lineCount]
      properties:
        path: {type: string, minLength: 1, maxLength: 4096}
        title: {type: string, maxLength: 512}
        tags:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 128}
        trustLevel: {enum: [SIGNED_POLICY, CURATED, PROJECT_APPROVED, GENERATED_UNREVIEWED, EXTERNAL_UNTRUSTED]}
        contentType: {type: string, minLength: 1, maxLength: 256}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        lineCount: {type: integer, minimum: 1}
        source: {$ref: '#/components/schemas/KnowledgeSourceReference'}
    KnowledgeManifest:
      type: object
      additionalProperties: false
      required: [version, tenantId, projectId, revision, createdAt, parentOrderExplicit, parents, overrides, documents]
      properties:
        version: {const: 1}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        parentOrderExplicit: {type: boolean}
        parents:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/KnowledgeParentSnapshot'}
        overrides:
          type: array
          items: {type: string, minLength: 1, maxLength: 4096}
        documents:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeDocumentMetadata'}
    KnowledgeUpdateDocument:
      type: object
      additionalProperties: false
      required: [path, title, tags, trustLevel, contentType, content]
      properties:
        path:
          type: string
          maxLength: 4096
          pattern: '^(inherited|requirements|architecture|modules|interfaces|decisions|prompts|workflows|tools|security|operations|lessons)/.+'
        title: {type: string, minLength: 1, maxLength: 512}
        tags:
          type: array
          maxItems: 128
          items: {type: string, minLength: 1, maxLength: 128}
        trustLevel: {enum: [CURATED, PROJECT_APPROVED, GENERATED_UNREVIEWED, EXTERNAL_UNTRUSTED]}
        source: {$ref: '#/components/schemas/KnowledgeSourceReference'}
        contentType: {type: string, minLength: 1, maxLength: 256}
        content: {type: string, minLength: 1, maxLength: 262144}
      allOf:
        - if:
            properties:
              trustLevel: {const: CURATED}
            required: [trustLevel]
          then:
            required: [source]
    KnowledgeUpdateProposal:
      type: object
      additionalProperties: false
      required: [baseRevision, parentOrderExplicit, parents, overrides, documents, deletePaths]
      properties:
        baseRevision: {type: string, pattern: '^(|sha256:[0-9a-f]{64})$'}
        parentOrderExplicit: {type: boolean}
        parents:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/KnowledgeParentSnapshot'}
        overrides:
          type: array
          maxItems: 4096
          items: {type: string, minLength: 1, maxLength: 4096}
        documents:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/KnowledgeUpdateDocument'}
        deletePaths:
          type: array
          maxItems: 4096
          items: {type: string, minLength: 1, maxLength: 4096}
    KnowledgeUpdateDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, instruction, proposal]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        instruction: {type: string, minLength: 1, maxLength: 16384}
        proposal: {$ref: '#/components/schemas/KnowledgeUpdateProposal'}
    KnowledgeUpdateApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, proposalDigest, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        proposalDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        reason: {type: string, minLength: 1, maxLength: 4096}
    KnowledgeUpdate:
      type: object
      additionalProperties: false
      required: [updateId, tenantId, projectId, projectVersion, status, proposalDigest, changeSummary, validationReport, proposal, draftUri, draftSha256, sourceRunId, createdAt]
      properties:
        updateId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        projectVersion: {type: integer, format: int64, minimum: 1}
        status: {enum: [DRAFT, APPROVED, APPLIED]}
        proposalDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        changeSummary: {type: string, minLength: 1, maxLength: 8192}
        validationReport: {$ref: '#/components/schemas/KnowledgeValidationReport'}
        proposal: {$ref: '#/components/schemas/KnowledgeUpdateProposal'}
        draftUri: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        draftSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        sourceRunId: {type: string, minLength: 1, maxLength: 128}
        approvalId: {type: string, format: uuid}
        revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        approvedAt: {type: string, format: date-time}
        appliedAt: {type: string, format: date-time}
    KnowledgeValidationCheck:
      type: object
      additionalProperties: false
      required: [ruleId, status]
      properties:
        ruleId: {type: string, minLength: 1, maxLength: 128}
        status: {enum: [PASS, FAIL]}
        path: {type: string, maxLength: 4096}
        message: {type: string, maxLength: 512}
    KnowledgeValidationReport:
      type: object
      additionalProperties: false
      required: [version, proposalDigest, passed, checks, sha256]
      properties:
        version: {const: 1}
        proposalDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        passed: {type: boolean, const: true}
        checks:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/KnowledgeValidationCheck'}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    BudgetAccount:
      type: object
      additionalProperties: false
      required: [id, scopeType, scopeId, currency, hardLimitMinor, softLimitMinor, spentMinor, reservedMinor, remainingMinor, periodStart, version]
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        scopeType: {enum: [PROJECT]}
        scopeId: {type: string, format: uuid}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        hardLimitMinor: {type: integer, format: int64, minimum: 0}
        softLimitMinor: {type: integer, format: int64, minimum: 0}
        spentMinor: {type: integer, format: int64, minimum: 0}
        reservedMinor: {type: integer, format: int64, minimum: 0}
        remainingMinor: {type: integer, format: int64, minimum: 0}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 1}
    BudgetCollection:
      type: object
      additionalProperties: false
      required: [projectId, items, version]
      properties:
        projectId: {type: string, format: uuid}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BudgetAccount'}
        version: {type: integer, format: int64, minimum: 1}
    BudgetUsage:
      type: object
      additionalProperties: false
      required: [projectId, accountId, currency, hardLimitMinor, softLimitMinor, spentMinor, reservedMinor, remainingMinor, reservationCount, callCount, inputTokens, outputTokens, costMinor, version]
      properties:
        projectId: {type: string, format: uuid}
        accountId: {type: string, minLength: 1, maxLength: 256}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        hardLimitMinor: {type: integer, format: int64, minimum: 0}
        softLimitMinor: {type: integer, format: int64, minimum: 0}
        spentMinor: {type: integer, format: int64, minimum: 0}
        reservedMinor: {type: integer, format: int64, minimum: 0}
        remainingMinor: {type: integer, format: int64, minimum: 0}
        reservationCount: {type: integer, format: int64, minimum: 0}
        callCount: {type: integer, format: int64, minimum: 0}
        inputTokens: {type: integer, format: int64, minimum: 0}
        outputTokens: {type: integer, format: int64, minimum: 0}
        costMinor: {type: integer, format: int64, minimum: 0}
        version: {type: integer, format: int64, minimum: 1}
    BudgetAdjustment:
      type: object
      additionalProperties: false
      required: [expectedVersion, hardLimitMinor, softLimitMinor, currency, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        hardLimitMinor: {type: integer, format: int64, minimum: 0}
        softLimitMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        reason: {type: string, minLength: 1, maxLength: 2048}
    BudgetAdjustmentResult:
      type: object
      additionalProperties: false
      required: [projectId, account, usage]
      properties:
        projectId: {type: string, format: uuid}
        account: {$ref: '#/components/schemas/BudgetAccount'}
        usage: {$ref: '#/components/schemas/BudgetUsage'}
    Page:
      type: object
      required: [items]
      properties:
        items: {type: array}
        nextCursor: {type: string}
  responses:
    ModelRouteSettings:
      description: Effective tenant model routes and persisted settings version
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelRouteSettings'}
    ProjectCreated:
      description: Project created
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Project'}
    Project:
      description: Project resource
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Project'}
    CommandAccepted:
      description: Command accepted exactly once
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {type: object, required: [commandId], properties: {commandId: {type: string}}}
    GoalCommandAccepted:
      description: Goal command committed, audited, and enqueued exactly once
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Project'}
    CapabilityLeaseCreated:
      description: Capability lease issued exactly once for the idempotency key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CapabilityLease'}
    CapabilityLease:
      description: Current signed capability lease
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CapabilityLease'}
    Page:
      description: Opaque-cursor page
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Page'}
    Entity:
      description: Tenant-scoped entity
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    Problem:
      description: Redacted AOR Problem Details
      content:
        application/problem+json:
          schema: {$ref: '../json-schema/aor-error.v1.schema.json'}
  pathItems:
    ProjectCommand:
      post:
        tags: [Projects]
        parameters:
          - $ref: '#/components/parameters/ProjectId'
          - $ref: '#/components/parameters/IdempotencyKey'
          - $ref: '#/components/parameters/IfMatch'
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Command'}
        responses:
          '202': {$ref: '#/components/responses/CommandAccepted'}
          default: {$ref: '#/components/responses/Problem'}
    VersionedProjectCommand:
      post:
        tags: [Goals]
        parameters:
          - $ref: '#/components/parameters/ProjectId'
          - $ref: '#/components/parameters/Version'
          - $ref: '#/components/parameters/IdempotencyKey'
          - $ref: '#/components/parameters/IfMatch'
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Command'}
        responses:
          '202': {$ref: '#/components/responses/CommandAccepted'}
          default: {$ref: '#/components/responses/Problem'}
    AdminCommand:
      post:
        tags: [Administration]
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        responses:
          '200': {$ref: '#/components/responses/Entity'}
          default: {$ref: '#/components/responses/Problem'}
