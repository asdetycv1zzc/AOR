      properties:
        projectId: {type: string, format: uuid}
        projectVersion: {type: integer, format: int64, minimum: 1}
        goalProcessing: {type: boolean}
        flows:
          type: array
          items: {enum: [GOAL, PLAN, EXECUTION, AUDIT, KNOWLEDGE]}
        agents:
          type: array
          items: {$ref: '#/components/schemas/ProjectActivityAgent'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/ProjectActivityMessage'}
        cursor: {type: string, maxLength: 64}
    GoalMessage:
      type: object
      additionalProperties: false
      required: [id, tenantId, projectId, kind, message, contentSha256, artifactUri, createdAt, createdBy]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        kind: {enum: [USER, REJECTION, CHANGE_REQUEST]}
        message: {type: string, minLength: 1, maxLength: 1048576}
        contentSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        artifactUri: {type: string, pattern: '^artifact://sha256/[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string, minLength: 1, maxLength: 256}
    GoalMessagePage:
      type: object
      additionalProperties: false
