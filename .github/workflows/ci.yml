name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify source
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: make verify

  cross-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-compile tests
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
          GOCACHE: ${{ github.workspace }}/.cache/go-build-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
        run: go test -exec=true ./...

  native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Run native Linux arm64 tests
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build-linux-arm64-native
        run: go test ./...

  native-windows-amd64:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Run native Windows amd64 tests
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build-windows-amd64-native
        run: go test ./...

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify locked modules
        run: go mod verify
      - name: Race-test offline package verification
        run: go test -race ./internal/supplychain -count=1
      - name: Validate release schemas and source formatting
        run: |
          go run ./cmd/aor-conformance schemas
          go run ./cmd/aor-conformance source-format
      - name: Build release verification tool
        run: go build -trimpath -o bin/aor-release ./cmd/aor-release

  dependency-vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Run pinned Go vulnerability gate
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
