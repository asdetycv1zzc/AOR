name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify source
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: make verify

  postgres-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: aor
          POSTGRES_USER: aor
          POSTGRES_PASSWORD: integration-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aor -d aor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply PostgreSQL migrations
        env:
          PGPASSWORD: integration-admin
          AOR_APP_PASSWORD: integration-app
        run: |
          docker run --rm --network host \
            -e PGPASSWORD -e AOR_APP_PASSWORD \
            -v "${{ github.workspace }}/migrations/postgres:/migrations:ro" \
            postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 \
            /bin/sh -ec 'for migration in /migrations/*.up.sql; do psql --host 127.0.0.1 --username aor --dbname aor --set ON_ERROR_STOP=1 --file "$migration"; done'
      - name: Enforce durable PostgreSQL reconciliation
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build-postgres-reconciliation
          AOR_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=aor user=aor password=integration-admin sslmode=disable
          AOR_TEST_POSTGRES_APP_DSN: host=127.0.0.1 port=5432 dbname=aor user=aor_app password=integration-app sslmode=disable
        run: make postgres-reconciliation

  cross-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-compile tests
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
          GOCACHE: ${{ github.workspace }}/.cache/go-build-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
        run: go test -exec=true ./...

  native-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Run native Linux arm64 tests
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build-linux-arm64-native
        run: go test ./...

  native-windows-amd64:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Run native Windows amd64 tests
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build-windows-amd64-native
        run: go test ./...

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify locked modules
        run: go mod verify
      - name: Race-test offline package verification
        run: go test -race ./internal/supplychain -count=1
      - name: Validate release schemas and source formatting
        run: |
          go run ./cmd/aor-conformance schemas
          go run ./cmd/aor-conformance source-format
      - name: Build release verification tool
        run: go build -trimpath -o bin/aor-release ./cmd/aor-release

  dependency-vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Run pinned Go vulnerability gate
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  container-vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: aor-server
            target: final
            image: aor/aor-server:ci
          - component: aor-model-gateway
            target: final
            image: aor/aor-model-gateway:ci
          - component: aor-tool-broker
            target: tool-broker-runtime
            image: aor/aor-tool-broker:ci
          - component: aor-worker
            target: worker-runtime
            image: aor/aor-worker:ci
    steps:
      - name: Check out source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Build runtime image
        run: >-
          docker build
          --file deploy/compose/Dockerfile
          --target ${{ matrix.target }}
          --build-arg AOR_COMPONENT=${{ matrix.component }}
          --tag ${{ matrix.image }}
          .
      - name: Reject High and Critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          version: v0.73.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
          timeout: 10m0s
