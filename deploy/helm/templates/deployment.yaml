apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aor.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "aor.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aor.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "aor.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aor-api
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop: {{ toJson .Values.securityContext.capabilitiesDrop }}
          env:
            - name: AOR_SANDBOX_LINUX_LEVEL
              value: {{ .Values.sandbox.linuxLevel | quote }}
            - name: AOR_SANDBOX_WINDOWS_LEVEL
              value: {{ .Values.sandbox.windowsLevel | quote }}
