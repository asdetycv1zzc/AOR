        psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000053_custom_model_providers.up.sql
        project_activity_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT to_regclass('public.project_activity_messages') IS NOT NULL AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'project_activity_messages' AND column_name = 'claim_request_id')")"
        if [ "$$project_activity_installed" != "t" ]; then
          psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000054_project_activity_messages.up.sql
        fi
        reasoning_summary_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'project_activity_messages' AND column_name = 'reasoning_summary')")"
        if [ "$$reasoning_summary_installed" != "t" ]; then
          psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000055_project_activity_reasoning_summary.up.sql
        fi
        toolchain_installations_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT to_regclass('public.toolchain_installations') IS NOT NULL AND to_regprocedure('public.aor_claim_toolchain_installations(integer,text,integer)') IS NOT NULL")"
