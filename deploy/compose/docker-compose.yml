name: aor

x-aor-common: &aor-common
  profiles: [aor]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  network_mode: host
  command: [serve]
  healthcheck:
    test: [CMD, /usr/local/bin/aor, healthcheck]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    command: [postgres, -c, listen_addresses=127.0.0.1]
    environment:
      POSTGRES_DB: aor
      POSTGRES_USER: aor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: [no-new-privileges:true]
    network_mode: host
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aor -d aor]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  postgres-migrate:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts: [postgres:127.0.0.1]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        core_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT to_regtype('aor_sha256') IS NOT NULL")"
        if [ "$$core_installed" != "t" ]; then
          psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000001_core.up.sql
        fi
        claims_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'inbox' AND column_name = 'claim_token')")"
        if [ "$$claims_installed" != "t" ]; then
          psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000002_inbox_claims.up.sql
        fi
        test -s /run/secrets/postgres_app_password
        export AOR_APP_PASSWORD="$$(cat /run/secrets/postgres_app_password)"
        runtime_role_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'aor_app')")"
        if [ "$$runtime_role_installed" != "t" ]; then
          psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000003_runtime_app_role.up.sql
        else
          psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/postgres-app-password.sql
        fi
        psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000004_model_authorizer_reads.up.sql
        runtime_records_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT to_regclass('public.agent_leases') IS NOT NULL")"
        if [ "$$runtime_records_installed" != "t" ]; then
          psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000005_runtime_records.up.sql
        fi
        lease_fencing_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT to_regprocedure('public.aor_advance_task_fencing(uuid,uuid,uuid,bigint)') IS NOT NULL")"
        if [ "$$lease_fencing_installed" != "t" ]; then
          psql --host postgres --username aor --dbname aor --set ON_ERROR_STOP=1 --file /migrations/000006_lease_fencing_function.up.sql
        fi
        runtime_record_grants_installed="$$(psql --host postgres --username aor --dbname aor --tuples-only --no-align --command "SELECT has_table_privilege('aor_app', 'public.agent_leases', 'INSERT')")"
        if [ "$$runtime_record_grants_installed" != "t" ]; then
