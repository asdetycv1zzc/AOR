  temporal:
    image: temporalio/auto-setup:1.29.1@sha256:5b3502a3b685f9eff1b925af90c57c9e3dbeccbef367cc28a2a9712c63379312
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: aor
      POSTGRES_SEEDS: 127.0.0.1
      BIND_ON_IP: 127.0.0.1
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      TEMPORAL_CLI_ADDRESS: 127.0.0.1:7233
    entrypoint: [/bin/sh, -ec]
    user: "0:0"
    command:
      - |
        export POSTGRES_PWD="$$(cat /run/secrets/postgres_password)"
        export HOME=/home/temporal
        exec /bin/su -p -s /bin/sh temporal -c 'exec /etc/temporal/entrypoint.sh autosetup'
    secrets: [postgres_password]
    volumes:
      - ./temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    security_opt: [no-new-privileges:true]
    network_mode: host
    healthcheck:
      test: [CMD-SHELL, 'temporal operator cluster health --address "$${TEMPORAL_ADDRESS}"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    stop_grace_period: 30s

  temporal-init:
    image: temporalio/auto-setup:1.29.1@sha256:5b3502a3b685f9eff1b925af90c57c9e3dbeccbef367cc28a2a9712c63379312
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        temporal operator namespace describe --namespace aor --address 127.0.0.1:7233 >/dev/null 2>&1 ||
          temporal operator namespace create --namespace aor --retention 72h --address 127.0.0.1:7233
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    network_mode: host

  temporal-ui:
    image: temporalio/ui:2.34.0@sha256:cb17ea423d76a8a19a269d0bcd81fc12eee1f6365acd2a56b590dafb35696a95
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:8090
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    network_mode: host
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nats:
    image: nats:2.11.8-alpine@sha256:71092f77d707a4a81b12aca5096d6b2d2e07ad16aa57c84066940a17af74f61a
    restart: unless-stopped
    command: [--jetstream, --addr=127.0.0.1, --store_dir=/data, --http_port=8222, --max_payload=33554432]
    volumes:
      - nats-data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    network_mode: host
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)"
        exec /usr/bin/docker-entrypoint.sh minio server /data --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
    secrets: [minio_root_user, minio_root_password]
    volumes:
      - minio-data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    network_mode: host
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        access_key="$$(cat /run/secrets/minio_root_user)"
        secret_key="$$(cat /run/secrets/minio_root_password)"
        export MC_HOST_aor="http://$$access_key:$$secret_key@127.0.0.1:9000"
        mc mb --ignore-existing aor/aor-artifacts
    secrets: [minio_root_user, minio_root_password]
    read_only: true
    tmpfs: [/tmp, /root/.mc]
    security_opt: [no-new-privileges:true]
    network_mode: host

  opa:
    image: openpolicyagent/opa:1.18.2-static@sha256:57f7d06808fff6de3ea1d698e6430990973ca1370be0e54975f0083d615521da
    restart: unless-stopped
    command: [run, --server, --addr=127.0.0.1:8181, --log-format=json, /policies/aor_authz.rego, /policies/data.json]
    volumes:
      - ../../policies/rego/aor_authz.rego:/policies/aor_authz.rego:ro
      - ../../policies/data/default.json:/policies/data.json:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    network_mode: host
    healthcheck:
      test: [CMD, /opa, eval, --fail, --format, discard, 'http.send({"method":"get","url":"http://127.0.0.1:8181/health"}).status_code == 200']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  identity:
    image: ghcr.io/dexidp/dex:master-alpine@sha256:9a7b454bee21e674eb00ccf6b4fe2e8f964ae139c4eeaf44c697d4365110aeca
    restart: unless-stopped
    command: [dex, serve, /etc/dex/config.yaml]
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    secrets: [aor_server_oauth_client_secret]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    network_mode: host
    healthcheck:
      test: [CMD, /usr/bin/wget, -q, -O, /dev/null, http://127.0.0.1:5558/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    restart: unless-stopped
    command: [--config=/etc/otelcol-contrib/config.yaml]
    user: "10001:10001"
    volumes:
      - ../../observability/otel-collector.compose.yaml:/etc/otelcol-contrib/config.yaml:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: host
    healthcheck:
      test: [CMD, /otelcol-contrib, validate, --config=/etc/otelcol-contrib/config.yaml]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  aor-api:
    <<: *aor-common
    image: aor/aor-server:0.1.0-test
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: server-runtime
      network: host
      args:
        AOR_COMPONENT: aor-server
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      temporal-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
      identity:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      AOR_ENVIRONMENT: test
      AOR_OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      AOR_SERVER_MODE: CONTROL
      AOR_LISTEN_ADDR: 0.0.0.0:8090
      AOR_HEALTHCHECK_URL: http://127.0.0.1:8090/health/ready
      AOR_WEB_ROOT: /usr/local/share/aor-web
      AOR_CONTROL_API_ALLOW_ANONYMOUS: "true"
      AOR_DATABASE_HOST: 127.0.0.1
      AOR_DATABASE_PORT: "5432"
      AOR_DATABASE_NAME: aor
      AOR_DATABASE_USER: aor_app
      AOR_DATABASE_PASSWORD_REF: secret://postgres_app_password
      AOR_DEPLOYMENT_PROFILE: TEST
      AOR_LEASE_SIGNING_KEY_REF: secret://lease_signing_key
      AOR_TEMPORAL_ADDRESS: 127.0.0.1:7233
      AOR_TEMPORAL_NAMESPACE: aor
      AOR_NATS_URL: nats://127.0.0.1:4222
      AOR_S3_ENDPOINT: http://127.0.0.1:9000
      AOR_S3_BUCKET: aor-artifacts
      AOR_S3_REGION: us-east-1
      AOR_S3_ACCESS_KEY_REF: secret://minio_root_user
      AOR_S3_SECRET_KEY_REF: secret://minio_root_password
      AOR_KNOWLEDGE_ROOT: /var/lib/aor/knowledge
      AOR_TOOLCHAIN_ROOT: /opt/aor/toolchains
      AOR_KNOWLEDGE_CURATOR_URL: http://127.0.0.1:8094
      AOR_OPA_URL: http://127.0.0.1:8181
      AOR_OIDC_ISSUER: http://127.0.0.1:5556/dex
      AOR_OIDC_JWKS_URL: http://127.0.0.1:5556/dex/keys
      AOR_OIDC_AUDIENCE: aor-control-plane
      AOR_OIDC_DEFAULT_TENANT_ID: 11111111-1111-4111-8111-111111111111
      AOR_OIDC_DEFAULT_ROLE: USER
      AOR_MODEL_GATEWAY_URL: http://127.0.0.1:8091
      AOR_MODEL_GATEWAY_OAUTH_TOKEN_ENDPOINT: http://127.0.0.1:5556/dex/token
      AOR_MODEL_GATEWAY_OAUTH_CLIENT_ID: aor-server
      AOR_MODEL_GATEWAY_OAUTH_CLIENT_SECRET_REF: secret://aor_server_oauth_client_secret
      AOR_MODEL_GATEWAY_OAUTH_SCOPES: audience:server:client_id:aor-control-plane
      AOR_MODEL_GATEWAY_OAUTH_AUDIENCE: aor-control-plane
      AOR_MODEL_REPLAY_KEY_REF: secret://model_replay_key
      AOR_MODEL_REPLAY_KEY_ID: compose-model-replay-v1
      AOR_MODEL_REPLAY_TTL_HOURS: "24"
    secrets: [postgres_app_password, model_replay_key, lease_signing_key, minio_root_user, minio_root_password, aor_server_oauth_client_secret]
    volumes:
      - "${AOR_KNOWLEDGE_HOST_PATH:-aor-knowledge-data}:/var/lib/aor/knowledge:ro"
      - "${AOR_TOOLCHAINS_HOST_PATH:-aor-toolchains-data}:/opt/aor/toolchains:ro"

  aor-curator:
    extends:
      service: aor-api
    network_mode: host
    environment:
      AOR_SERVER_MODE: KNOWLEDGE_CURATOR
      AOR_LISTEN_ADDR: 127.0.0.1:8094
      AOR_HEALTHCHECK_URL: http://127.0.0.1:8094/health/ready
      AOR_KNOWLEDGE_CURATOR_URL: ""
      AOR_TOOLCHAIN_ROOT: /opt/aor/toolchains
    volumes: !override
      - "${AOR_KNOWLEDGE_HOST_PATH:-aor-knowledge-data}:/var/lib/aor/knowledge:rw"
      - "${AOR_TOOLCHAINS_HOST_PATH:-aor-toolchains-data}:/opt/aor/toolchains:ro"

